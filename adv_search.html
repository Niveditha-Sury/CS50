<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advance Search</title>
        <meta name="content" content="width=device-width initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
       <div class="container">
        <a href="index.html" target="_blank">Search</a>
        <a href="images_search.html" target="_blank">Image_search</a>
       </div>
       <div class="search">
         <h1>Advance Search</h1>
         <form action="https://google.com/search">
          <p>Search For: </p> 
          <label> all these words:
            <input type="text"  name="as_q" class="search1">
          </label> <br>
          <label> this exact word or phrase:
            <input type="text"  name="as_epq" class="search1" >
          </label> <br>
          <label> any of these words:
            <input type="text"  name="as_oq" class="search1">
          </label> <br>
          <label> none of these words:
            <input type="text"  name="as_eq" class="search1" >
          </label> <br>
           <button type="submit" id="btn">Advanced search</button>
          </form>
       </div>
      </body>
</html>
